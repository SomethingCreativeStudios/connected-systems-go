server:
  host: localhost
  port: 8080

database:
  host: localhost
  port: 5432
  name: connected_systems
  user: postgres
  password: postgres
  # disable, require, verify-ca or verify-full (default disable).
  sslmode: disable
  # Connection pool limits; 0 keeps the database/sql defaults.
  # max_open_conns: 0
  # max_idle_conns: 0
  # conn_max_lifetime: 0s
  # Apply pending migrations at startup (default true). When false, run
  # `server migrate` before starting the server.
  auto_migrate: true

api:
  base_url: http://localhost:8080
  title: "OGC Connected Systems API"
  description: "OGC API - Connected Systems - Part 1: Feature Resources"
  version: "1.0.0"
  # Largest accepted request body, in bytes (default 10 MiB).
  # max_body_bytes: 10485760

# Optional embedded CS API MQTT endpoint (disabled by default).
# mqtt:
#   enabled: false
#   node_id: node1
#   public_brokers: mqtt://localhost:1883,ws://localhost:9001/mqtt
#   tcp_address: 127.0.0.1:1883
#   websocket_address: 127.0.0.1:9001
#   data_dir: ./data/mqtt
#   allow_anonymous: false
#   users_file: ./mqtt-users.json
#   ingest_timeout: 2s
#   max_message_bytes: 10485760

# Connected Systems publish/subscribe message classes. These default to true,
# but MQTT must also be enabled before any class can publish or subscribe.
pubsub:
  resource_data:
    enabled: true
  resource_events:
    enabled: true
  batch_resource_events:
    enabled: true
    # Requires resource_events.enabled.
    # Go-style duration for UTC clock-aligned observation and command batches.
    window: 1m
