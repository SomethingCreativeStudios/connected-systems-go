server:
  host: localhost
  port: 8080

database:
  host: localhost
  port: 5432
  name: connected_systems
  user: postgres
  password: postgres

api:
  base_url: http://localhost:8080
  title: "OGC Connected Systems API"
  description: "OGC API - Connected Systems - Part 1: Feature Resources"
  version: "1.0.0"

# MQTT broker for publish/subscribe messaging (disabled by default)
# mqtt:
#   enabled: false
#   broker: tcp://localhost:1883
#   client_id: cs-api-server
#   username: ""
#   password: ""
#   qos: 1
#   retained: false

# Connected Systems publish/subscribe message classes. These default to true,
# but MQTT must also be enabled before any class can publish or subscribe.
pubsub:
  resource_data:
    enabled: true
  resource_events:
    enabled: true
  batch_resource_events:
    enabled: true
    # Go-style duration for UTC clock-aligned observation and command batches.
    window: 1m
