services:
  db:
    image: timescale/timescaledb-ha:pg18
    environment:
      POSTGRES_DB: connected_systems
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      # A distinct volume keeps the previous PostgreSQL-only dev database
      # untouched while this deployment starts with a TimescaleDB schema.
      - timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d connected_systems"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_WEBSOCKET_PORT:-9001}:9001"
    volumes:
      - ./mosquitto.local.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -t 'health/check' -m '1' -q 0 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: connected-systems-go:local
    ports:
      - "127.0.0.1:${API_PORT:-8070}:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: 8080
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${API_PORT:-8070}}"
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: connected_systems
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      MQTT_ENABLED: "true"
      MQTT_BROKER: "tcp://mqtt:1883"
      MQTT_CLIENT_ID: "cs-api-server"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/conformance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  viewer:
    # Optional: docker compose --profile viewer up --build -d
    profiles: ["viewer"]
    image: ${VIEWER_IMAGE:-docker.monogatari.dev/connected-systems/cs-api-viewer:latest}
    ports:
      - "127.0.0.1:${VIEWER_PORT:-8081}:80"
    environment:
      API_PROXY_TARGET: http://api:8080
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${API_PORT:-8070}}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescale_data:
  mosquitto_data:
