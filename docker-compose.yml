services:
  db:
    image: timescale/timescaledb-ha:pg18
    environment:
      POSTGRES_DB: connected_systems
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      # A distinct volume keeps the previous PostgreSQL-only dev database
      # untouched while this deployment starts with a TimescaleDB schema.
      - timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d connected_systems"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: connected-systems-go:local
    ports:
      - "127.0.0.1:${API_PORT:-8070}:8080"
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_WEBSOCKET_PORT:-9001}:9001"
    volumes:
      - mqtt_data:/var/lib/csapi/mqtt
      - "${MQTT_USERS_DIR:-./examples/mqtt}:/run/csapi-mqtt:ro"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: 8080
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${API_PORT:-8070}}"
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: connected_systems
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      MQTT_ENABLED: "true"
      MQTT_NODE_ID: "${MQTT_NODE_ID:-node1}"
      MQTT_ALLOW_ANONYMOUS: "${MQTT_ALLOW_ANONYMOUS:-true}"
      MQTT_TCP_ADDRESS: "0.0.0.0:1883"
      MQTT_WEBSOCKET_ADDRESS: "0.0.0.0:9001"
      MQTT_DATA_DIR: "/var/lib/csapi/mqtt"
      MQTT_USERS_FILE: "${MQTT_USERS_FILE:-}"
      MQTT_INGEST_TIMEOUT: "${MQTT_INGEST_TIMEOUT:-2s}"
      MQTT_MAX_MESSAGE_BYTES: "${MQTT_MAX_MESSAGE_BYTES:-10485760}"
      MQTT_PUBLIC_BROKERS: "${MQTT_PUBLIC_BROKERS:-mqtt://localhost:${MQTT_PORT:-1883},ws://localhost:${MQTT_WEBSOCKET_PORT:-9001}/mqtt}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/conformance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  viewer:
    # Optional: docker compose --profile viewer up --build -d
    profiles: ["viewer"]
    image: ${VIEWER_IMAGE:-docker.monogatari.dev/connected-systems/cs-api-viewer:latest}
    ports:
      - "127.0.0.1:${VIEWER_PORT:-8081}:80"
    environment:
      API_PROXY_TARGET: http://api:8080
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${API_PORT:-8070}}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescale_data:
  mqtt_data:
