# Mosquitto MQTT broker configuration.
# Requires a password file — generate with:
#   mosquitto_passwd -c mosquitto_passwd <username>
# (add more users with -b instead of -c to avoid overwriting the file)

# Native MQTT listener
listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto_passwd

# WebSocket listener for browser clients
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/mosquitto_passwd

persistence true
persistence_location /mosquitto/data/
